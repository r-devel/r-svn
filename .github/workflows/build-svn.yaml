on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build R from SVN mirror
    uses: r-devel/actions/.github/workflows/build-svn.yaml@main
